name: methylation-beta-pipeline
channels:
  - conda-forge
  - bioconda
dependencies:
  # Core languages
  - python=3.11
  - pip
  - r-base=4.5

  # Bioconductor / SeSAMe
  - bioconductor-sesame=1.28.1
  - bioconductor-sesamedata=1.28.0
  - bioconductor-biocparallel
  - bioconductor-experimenthub
  - bioconductor-biocfilecache
  - bioconductor-preprocesscore=1.72.0

  # R package management
  - r-biocmanager
  - r-remotes

  # Compiler toolchain required for source installation of preprocessCore
  - gcc_linux-64
  - gxx_linux-64
  - gfortran_linux-64
  - binutils_linux-64
  - sysroot_linux-64
  - make
  - pkg-config

  # R packages used by the pipeline
  - r-logger
  - r-data.table
  - r-dplyr
  - r-magrittr
  - r-this.path
  - r-tidyr
  - r-rcpptoml
  - r-tidyverse
  - r-ggplot2
  - r-knitr
  - r-gridextra
  - r-cowplot
  - r-broom
  - r-scales
  - r-jsonlite
  - r-readr
  - r-stringr

  # Python packages used by scripts_postprocess
  - pandas
  - numpy
  - scipy
  - scikit-learn
  - threadpoolctl
  - matplotlib
  - seaborn
  - openpyxl
  - tqdm
  - pyarrow
  - statsmodels

  # pip packages
  - pip:
      - biolearn==0.9.1
      - torch==2.5.1
